name: Recompute ROI

on:
  workflow_dispatch:
  schedule:
    - cron: '5 8 * * *'

permissions:
  contents: write

jobs:
  recompute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Recompute ROI
        run: python scripts/recompute_roi.py --input input/deals.sample.json --output output/roi_results.json

      - name: Commit results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- output/roi_results.json; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/roi_results.json
          git commit -m "chore: recompute ROI [skip ci]"
          git push

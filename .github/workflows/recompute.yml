name: Recompute ROI

on:
  workflow_dispatch:
  schedule:
    - cron: '5 8 * * *'

permissions:
  contents: write

jobs:
  recompute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Merge manual enrichment
        run: >-
          python scripts/merge_enrichment.py
          --deals input/canadiantire_all_liquidations.json
          --enrichment input/manual_enrichment.json
          --out input/market_ready.json

      - name: Recompute ROI
        run: python scripts/recompute_roi.py --input input/market_ready.json --output output/marketplace.json --top 300

      - name: Commit results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- input/market_ready.json output/marketplace.json; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add input/market_ready.json output/marketplace.json
          git commit -m "chore: update marketplace [skip ci]"
          git push

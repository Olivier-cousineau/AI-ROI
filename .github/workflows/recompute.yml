name: Recompute ROI

on:
  workflow_dispatch:
  schedule:
    - cron: '5 8 * * *'

permissions:
  contents: write

env:
  PYTHONPATH: .
  EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
  EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
  CT_STORE_FOLDER: ""
  MAX_MARKETPLACE_ITEMS: "1000"
  TEST_CT_STORE_SLUG: ""

jobs:
  recompute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set marketplace defaults
        run: |
          if [ -z "${MAX_MARKETPLACE_ITEMS}" ]; then
            if [ -n "${CT_STORE_FOLDER}" ]; then
              echo "MAX_MARKETPLACE_ITEMS=50" >> "$GITHUB_ENV"
            else
              echo "MAX_MARKETPLACE_ITEMS=300" >> "$GITHUB_ENV"
            fi
          fi

      - name: Echo MAX_MARKETPLACE_ITEMS
        run: echo "MAX_MARKETPLACE_ITEMS=${MAX_MARKETPLACE_ITEMS}"

      - name: Fetch all Canadian Tire stores from EconoPlus
        env:
          ECONOPLUS_TOKEN: ${{ secrets.ECONOPLUS }}
        run: |
          rm -rf econoplus
          git clone https://x-access-token:${ECONOPLUS_TOKEN}@github.com/Olivier-cousineau/EconoPlus.git econoplus
          rm -rf input/canadiantire
          mkdir -p input/canadiantire
          if [ -n "${TEST_CT_STORE_SLUG}" ]; then
            mkdir -p "input/canadiantire/${TEST_CT_STORE_SLUG}"
            cp -R "econoplus/public/canadiantire/${TEST_CT_STORE_SLUG}/" "input/canadiantire/${TEST_CT_STORE_SLUG}/"
          elif [ -n "${CT_STORE_FOLDER}" ]; then
            mkdir -p "input/canadiantire/${CT_STORE_FOLDER}"
            cp -R "econoplus/public/canadiantire/${CT_STORE_FOLDER}/" "input/canadiantire/${CT_STORE_FOLDER}/"
          else
            cp -R econoplus/public/canadiantire/* input/canadiantire/
          fi

      - name: Merge all Canadian Tire stores
        run: python scripts/merge_all_stores.py --input-dir input/canadiantire --output input/canadiantire_all_liquidations.json

      - name: Build market-ready input
        run: >-
          python scripts/build_market_ready.py
          --deals input/canadiantire_all_liquidations.json
          --out input/market_ready.json
          --max-marketplace-items ${MAX_MARKETPLACE_ITEMS}

      - name: Fetch eBay OAuth token
        continue-on-error: true
        run: python scripts/fetch_ebay_token.py

      - name: Enrich eBay marketplace data
        run: >-
          python scripts/enrich_ebay.py
          --input input/market_ready.json
          --output output/marketplace.json
          --max-ebay-queries ${MAX_MARKETPLACE_ITEMS}

      - name: Recompute ROI
        run: python scripts/recompute_roi.py --input output/marketplace.json --output output/marketplace.json --top 300

      - name: Commit results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- output/marketplace.json output/roi_results.json; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/marketplace.json output/roi_results.json
          if ! git diff --quiet -- input/market_ready.json; then
            git add input/market_ready.json
          fi
          git commit -m "chore: update marketplace [skip ci]"
          git push

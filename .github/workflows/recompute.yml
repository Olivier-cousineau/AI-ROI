name: Recompute ROI

on:
  workflow_dispatch:
    inputs:
      testrun:
        description: "Run workflow with local test input instead of cloning EconoPlus."
        required: false
        default: "false"
      testrun_file:
        description: "Path to the local test input file."
        required: false
        default: "input/testrun/deals.json"
      source:
        description: "Source to pass to recompute_roi.py."
        required: false
        default: "bestbuy"
      top:
        description: "Top N results to keep."
        required: false
        default: "300"
  schedule:
    - cron: '5 8 * * *'

permissions:
  contents: write

env:
  PYTHONPATH: .
  EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
  EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
  CT_STORE_FOLDER: ""
  MAX_MARKETPLACE_ITEMS: "1000"
  TEST_CT_STORE_SLUG: ""

jobs:
  recompute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Select deals input
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "inputs.testrun=${{ inputs.testrun }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.testrun }}" = "true" ]; then
            deals_file="${{ inputs.testrun_file }}"
            if [[ "${deals_file}" != input/testrun/* ]]; then
              echo "testrun_file must start with input/testrun/. Got: ${deals_file}" >&2
              exit 1
            fi
            echo "DEALS_FILE=${deals_file}" >> "$GITHUB_ENV"
            echo "IS_TESTRUN=true" >> "$GITHUB_ENV"
            echo "MAX_MARKETPLACE_ITEMS=20" >> "$GITHUB_ENV"
            echo "MAX_EBAY_QUERIES=20" >> "$GITHUB_ENV"
          else
            echo "DEALS_FILE=econoplus/public/bestbuy/online.json" >> "$GITHUB_ENV"
            echo "IS_TESTRUN=false" >> "$GITHUB_ENV"
            echo "MAX_EBAY_QUERIES=${MAX_MARKETPLACE_ITEMS}" >> "$GITHUB_ENV"
          fi

      - name: Set marketplace defaults
        run: |
          if [ -z "${MAX_MARKETPLACE_ITEMS}" ]; then
            if [ -n "${CT_STORE_FOLDER}" ]; then
              echo "MAX_MARKETPLACE_ITEMS=50" >> "$GITHUB_ENV"
            else
              echo "MAX_MARKETPLACE_ITEMS=300" >> "$GITHUB_ENV"
            fi
          fi

      - name: Echo MAX_MARKETPLACE_ITEMS
        run: echo "MAX_MARKETPLACE_ITEMS=${MAX_MARKETPLACE_ITEMS}"
      - name: Select ROI defaults
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ROI_SOURCE=${{ inputs.source }}" >> "$GITHUB_ENV"
            echo "ROI_TOP=${{ inputs.top }}" >> "$GITHUB_ENV"
          else
            echo "ROI_SOURCE=bestbuy" >> "$GITHUB_ENV"
            echo "ROI_TOP=300" >> "$GITHUB_ENV"
          fi

      - name: Fetch BestBuy deals from EconoPlus
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.testrun == 'true') }}
        env:
          ECONOPLUS_TOKEN: ${{ secrets.ECONOPLUS }}
        run: |
          rm -rf econoplus
          git clone https://x-access-token:${ECONOPLUS_TOKEN}@github.com/Olivier-cousineau/EconoPlus.git econoplus
          find econoplus/public/bestbuy -type f
          rm -rf input/bestbuy
          mkdir -p input/bestbuy
          cp -R econoplus/public/bestbuy/* input/bestbuy/

      - name: Validate BestBuy deals input
        run: |
          ls -la "$(dirname "${DEALS_FILE}")"
          test -f "${DEALS_FILE}"
          python - <<'PY'
          import os
          import json
          from pathlib import Path

          deals_path = Path(os.environ["DEALS_FILE"])
          payload = json.loads(deals_path.read_text(encoding="utf-8"))
          print(f"BestBuy deals count: {len(payload)}")
          PY

      - name: Build market-ready input
        run: >-
          python scripts/build_market_ready.py
          --deals ${DEALS_FILE}
          --out input/market_ready.json
          --max-marketplace-items ${MAX_MARKETPLACE_ITEMS}

      - name: Log testrun market-ready sample
        if: ${{ env.IS_TESTRUN == 'true' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("input/market_ready.json").read_text(encoding="utf-8"))
          for entry in payload[:4]:
              deal = entry.get("deal", {})
              print(f"title={deal.get('title')} source={deal.get('source')} key={deal.get('key')}")
          PY

      - name: Cleanup testrun cache
        if: ${{ env.IS_TESTRUN == 'true' }}
        run: |
          rm -f output/marketplace.json output/roi_results.json
          rm -rf cache/ebay .cache

      - name: Fetch eBay OAuth token
        continue-on-error: true
        run: python scripts/fetch_ebay_token.py

      - name: Enrich eBay marketplace data
        run: >-
          python scripts/enrich_ebay.py
          --input input/market_ready.json
          --output output/marketplace.json
          --max-ebay-queries ${MAX_EBAY_QUERIES}

      - name: Validate marketplace output sample
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          marketplace_path = Path("output/marketplace.json")
          payload = json.loads(marketplace_path.read_text(encoding="utf-8"))
          print(f"Marketplace count: {len(payload)}")
          print("Marketplace sample:", json.dumps(payload[0] if payload else {}, ensure_ascii=False))
          PY

      - name: Validate market-ready input sample keys
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          market_ready_path = Path("input/market_ready.json")
          payload = json.loads(market_ready_path.read_text(encoding="utf-8"))
          sample_keys = list(payload[0].keys()) if payload else []
          print(f"Market-ready count: {len(payload)}")
          print("Market-ready sample keys:", sample_keys)
          PY

      - name: Select ROI input
        run: |
          if [ "${IS_TESTRUN}" = "true" ]; then
            echo "ROI_INPUT=input/market_ready.json" >> "$GITHUB_ENV"
          else
            echo "ROI_INPUT=${DEALS_FILE}" >> "$GITHUB_ENV"
          fi

      - name: Recompute ROI
        run: |
          python scripts/recompute_roi.py --source ${ROI_SOURCE} --input ${ROI_INPUT} --output output/roi_results.json --top ${ROI_TOP}

      - name: Commit results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- output/marketplace.json output/roi_results.json; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/marketplace.json output/roi_results.json
          if ! git diff --quiet -- input/market_ready.json; then
            git add input/market_ready.json
          fi
          git commit -m "chore: update marketplace [skip ci]"
          git push
